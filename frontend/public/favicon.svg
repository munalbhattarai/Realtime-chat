<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140726"/>
      <stop offset="100%" stop-color="#240c42"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#863bff"/>
    </linearGradient>
    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#863bff"/>
      <stop offset="50%" stop-color="#d946ef"/>
      <stop offset="100%" stop-color="#ff2a6d"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Rounded Base -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)"/>
  <rect x="24" y="24" width="464" height="464" rx="104" stroke="url(#borderGrad)" stroke-width="8" stroke-opacity="0.8"/>

  <!-- Ambient Glow Behind Bubble -->
  <circle cx="256" cy="240" r="140" fill="#863bff" opacity="0.35" filter="url(#glow)"/>

  <!-- Chat Bubble Body -->
  <g filter="url(#glow)">
    <rect x="76" y="80" width="360" height="300" rx="64" fill="url(#bubbleGrad)"/>
    <!-- Tail Pointer -->
    <path d="M 280 376 L 360 436 L 330 376 Z" fill="#ff2a6d"/>
  </g>

  <!-- Inner Dark Bubble -->
  <rect x="88" y="92" width="336" height="276" rx="52" fill="#0e061a"/>

  <!-- MB Monogram -->
  <!-- M Shape -->
  <path d="M 124 148 L 148 148 L 180 230 L 212 148 L 236 148 L 236 312 L 208 312 L 208 200 L 188 256 L 172 256 L 152 200 L 152 312 L 124 312 Z" fill="#ffffff"/>
  
  <!-- B Shape -->
  <path d="M 268 148 L 330 148 C 362 148 382 164 382 192 C 382 214 368 226 350 232 C 374 238 390 252 390 278 C 390 306 366 322 332 322 L 268 322 Z M 296 174 L 296 218 L 326 218 C 342 218 354 210 354 196 C 354 182 342 174 326 174 Z M 296 242 L 296 296 L 330 296 C 348 296 360 286 360 269 C 360 252 348 242 330 242 Z" fill="url(#bubbleGrad)"/>

  <!-- Live Pulse Dots -->
  <circle cx="366" cy="116" r="7" fill="#00f0ff"/>
  <circle cx="386" cy="116" r="7" fill="#a855f7"/>
  <circle cx="406" cy="116" r="7" fill="#ff2a6d"/>
</svg>